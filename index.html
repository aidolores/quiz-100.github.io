<!DOCTYPE html>
<html>
<head>
    <title>Embedded Content</title>
</head>
<body>
    <iframe id="myIframe" src="about:blank" style="width:100%; height:500px; border:none;"></iframe>
    <script>
        // JavaScript to dynamically add content to the iframe
        const iframe = document.getElementById('myIframe');
        iframe.onload = function() {
            const iframeDoc = iframe.contentWindow.document;
            iframeDoc.body.innerHTML = '<h1>Hello from the iframe!</h1><p>This content was added dynamically.</p>';
        };
    </script>
</body>
</html>
